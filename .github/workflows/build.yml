name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for the iPhone simulator
        run: |
          xcodebuild build \
            -project Engrave.xcodeproj \
            -target Engrave \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO
